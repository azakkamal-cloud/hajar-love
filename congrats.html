<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Félicitations</title>
  <style>
    body {
      background: radial-gradient(circle at top, #ffedf0 0%, #fff 70%);
      color: #b30000;
      font-family: "Arial", sans-serif;
      text-align: center;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    h1 {
      font-size: 3rem;
      margin: 0 0 1rem;
      animation: bounce 1s ease-in-out infinite alternate;
    }
    p {
      font-size: 2rem;
      margin: 0 0 2rem;
    }
    .heart {
      font-size: 5rem;
      animation: pulseHeart 1s ease-in-out infinite;
      margin: 1rem 0;
    }
    @keyframes pulseHeart {
      0% { transform: scale(1); color: #ff4d79; }
      50% { transform: scale(1.25); color: #ff002b; }
      100% { transform: scale(1); color: #ff4d79; }
    }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <h1>🎉 Mbrokkk Azin l3alam 🎉</h1>
  <p>50 clics MN NIYTKK</p>
  <div class="heart">❤️</div>
  <p>Msalya 9Bk olah😁</p>
</body>
</html>
